# Release Word Search App: check everything, then put it all up, or put nothing up.
#
# How to use it:
#   1. Merge devel into master and push master.
#   2. Publish a GitHub release whose tag is "v" + the version in
#      pyproject.toml, e.g. version 3.1.1 -> tag v3.1.1-beta (or v3.1.1).
#   3. This workflow does the rest: builds the packages, attaches them to the
#      release and uploads to PyPI.
#
# Failsafes:
#   - Nothing public happens until every check in the "check" job passes.
#   - The step that can be undone (release files) runs first. PyPI runs
#     last, because an upload to PyPI can't be taken back.
#   - If anything fails, the "rollback" job takes back down whatever this run
#     put up, and turns the release back into a draft with its tag removed,
#     so you can fix the problem and publish the draft again.
#
# Dry run: pull requests, and "Run workflow" on the Actions tab, only run the
# "check" job. They never publish anything.

name: Release

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional: a release tag to test against the version, e.g. v3.1.1-beta"
        required: false
        default: ""

permissions:
  contents: read

# Never run two releases of the same tag at once.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  PACKAGE: word-search-app  # The project name on PyPI
  DIST_NAME: word_search_app  # How the built package files are named
  PYTHON_VERSION: "3.11"  # The oldest Python that pyproject.toml supports

jobs:
  check:
    name: Check (build, smoke test, version)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history, so we can check the tag is on master

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Check version and tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pyproject.toml version: $VERSION"

          # The tag must be "v" + version, optionally followed by "-something" (like -beta).
          if [ -n "$TAG" ]; then
            case "$TAG" in
              "v$VERSION" | "v$VERSION"-*) echo "Tag $TAG matches version $VERSION." ;;
              *) echo "::error::Tag $TAG does not match pyproject.toml version $VERSION. Expected v$VERSION or v$VERSION-beta."; exit 1 ;;
            esac
          fi

          # A real release must come from a commit that is already on master.
          if [ "$EVENT" = "release" ]; then
            git fetch origin master
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "Tag $TAG is on master."
            else
              echo "::error::Tag $TAG points at a commit that is not on master. Merge to master and push it first."
              exit 1
            fi
          fi

          # PyPI never accepts the same version twice, so catch that now.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$PACKAGE/$VERSION/json?run=$RUN_ID")
          if [ "$STATUS" = "200" ]; then
            if [ "$EVENT" = "release" ]; then
              echo "::error::$PACKAGE $VERSION is already on PyPI. Bump the version in pyproject.toml first."
              exit 1
            fi
            echo "::warning::$PACKAGE $VERSION is already on PyPI. Bump the version before releasing."
          elif [ "$STATUS" = "404" ]; then
            echo "$PACKAGE $VERSION is not on PyPI yet. Good."
          else
            echo "::error::Could not ask PyPI about $PACKAGE $VERSION (HTTP $STATUS)."
            exit 1
          fi

      - name: Build packages
        run: python -m build

      - name: Check packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          twine check --strict dist/*
          ls dist
          for FILE in "$DIST_NAME-$VERSION.tar.gz" "$DIST_NAME-$VERSION-py3-none-any.whl"; do
            if [ ! -f "dist/$FILE" ]; then
              echo "::error::Expected dist/$FILE but it was not built."
              exit 1
            fi
          done

      # This project has no unit tests yet, so at least make sure the built
      # wheel installs and imports. Run from outside the checkout so Python
      # imports the installed package, not the source folder.
      - name: Smoke test the built wheel
        run: |
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c 'import wordsearchgen, wordsearchgen.__main__, wordsearchgen.gui_common; print("Imported", wordsearchgen.__file__)'

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error


  attach:
    name: Attach packages to the release
    needs: check
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Upload packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

  pypi:
    name: Upload to PyPI
    needs: [check, attach]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/word-search-app/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write  # Trusted publishing: PyPI checks this repo and workflow instead of a token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  rollback:
    name: Roll back after a failure
    needs: [check, attach, pypi]
    if: github.event_name == 'release' && (failure() || cancelled())
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
      RELEASE_ID: ${{ github.event.release.id }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      # If PyPI got the package after all, PyPI can't be undone, so taking the
      # rest down would only make things worse. Keep it up and say so.
      - name: Check whether PyPI already has this version
        id: pypi
        env:
          PYPI_RESULT: ${{ needs.pypi.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$PYPI_RESULT" = "skipped" ] || [ -z "$VERSION" ]; then
            echo "The PyPI step never ran, so PyPI was not touched."
            echo "on_pypi=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=""
          for TRY in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$PACKAGE/$VERSION/json?run=$RUN_ID-$TRY")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ]; then
              break
            fi
            sleep 10
          done
          if [ "$STATUS" = "200" ]; then
            echo "on_pypi=true" >> "$GITHUB_OUTPUT"
            echo "::error::$PACKAGE $VERSION reached PyPI even though the PyPI step failed. PyPI uploads can't be undone, so the release was left up to match. Check https://pypi.org/project/$PACKAGE/$VERSION/#files: if a file is missing, upload it by hand, or yank $VERSION on PyPI and release a new version."
            exit 1
          fi
          echo "PyPI does not have $PACKAGE $VERSION (HTTP $STATUS). Rolling back."
          echo "on_pypi=false" >> "$GITHUB_OUTPUT"

      - name: Remove packages from the release
        if: always() && steps.pypi.outputs.on_pypi == 'false'
        run: |
          gh api "repos/$REPO/releases/$RELEASE_ID/assets" --jq '.[] | select(.name | startswith(env.DIST_NAME + "-" + env.VERSION)) | "\(.id) \(.name)"' |
          while read -r ID NAME; do
            gh api -X DELETE "repos/$REPO/releases/assets/$ID"
            echo "Removed $NAME from the release."
          done

      - name: Turn the release back into a draft
        if: always() && steps.pypi.outputs.on_pypi == 'false'
        run: |
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=true --jq '"Release \(.name) is a draft again."'

      - name: Remove the tag
        if: always() && steps.pypi.outputs.on_pypi == 'false'
        run: |
          # Only delete the tag if it still points at the commit this run released.
          TAG_SHA=$(gh api "repos/$REPO/commits/$TAG" --jq .sha || true)
          if [ "$TAG_SHA" = "$GITHUB_SHA" ]; then
            gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG"
            echo "Removed tag $TAG. Publishing the draft again will recreate it."
          else
            echo "::warning::Tag $TAG points at '$TAG_SHA', not $GITHUB_SHA. Left it alone."
          fi
